name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: 10.0.x

# Least privilege by default; publish jobs opt into more where needed.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore UniFi.NET.slnx

      - name: Build solution (Release)
        run: dotnet build UniFi.NET.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UniFi.NET.slnx --configuration Release --no-build --verbosity normal

  pack:
    name: Pack ${{ matrix.name }}
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UniFi.Network.Client
            project: src/UniFi.Network.Client/UniFi.Network.Client.csproj
          - name: UniFi.SiteManager.Client
            project: src/UniFi.SiteManager.Client/UniFi.SiteManager.Client.csproj
          - name: UniFi.Protect.Client
            project: src/UniFi.Protect.Client/UniFi.Protect.Client.csproj
          - name: UniFi.Mobility.Client
            project: src/UniFi.Mobility.Client/UniFi.Mobility.Client.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine package version
        id: version
        run: |
          # Each package is versioned independently via its own <Version> in the .csproj
          # (e.g. Network tracks the Network API version, Protect the Protect API version).
          CSPROJ_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "${{ matrix.project }}")
          BASE_VERSION=${CSPROJ_VERSION:-1.0.0}

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release: publish each package at the version declared in its .csproj.
            # Already-published versions are skipped on push (--skip-duplicate),
            # so a tag only releases packages whose version was bumped.
            PKG_VERSION="${BASE_VERSION}"
          else
            # Canary build: target version from .csproj + build number (e.g. 7.1.87-canary.12)
            PKG_VERSION="${BASE_VERSION}-canary.${{ github.run_number }}"
          fi

          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "Packing ${{ matrix.name }} as ${PKG_VERSION}"

      - name: Pack ${{ matrix.name }}
        run: >
          dotnet pack "${{ matrix.project }}"
          --configuration Release
          /p:Version=${{ steps.version.outputs.pkg_version }}
          --output ${{ github.workspace }}/artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-${{ matrix.name }}
          path: ${{ github.workspace }}/artifacts/*.nupkg

  publish-canary:
    name: Publish Canary (GitHub Packages)
    needs: pack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nuget-*
          merge-multiple: true
          path: ${{ github.workspace }}/artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

  publish-nuget:
    name: Publish Release (NuGet.org)
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Must match the Environment configured on the NuGet.org Trusted Publisher policy.
    environment: production
    permissions:
      contents: read
      id-token: write   # required to mint the short-lived OIDC token for Trusted Publishing

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nuget-*
          merge-multiple: true
          path: ${{ github.workspace }}/artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Sign packages
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMPER: ${{ vars.SIGNING_TIMESTAMPER_URL || 'http://timestamp.digicert.com' }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::error::SIGNING_CERTIFICATE_BASE64 is not set. NuGet.org requires signed packages once a certificate is registered."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/signing-cert.pfx"
          echo "$CERT_BASE64" | base64 -d > "$CERT_PATH"
          dotnet nuget sign "${{ github.workspace }}/artifacts/*.nupkg" \
            --certificate-path "$CERT_PATH" \
            --certificate-password "$CERT_PASSWORD" \
            --timestamper "$TIMESTAMPER"

      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived NuGet.org
      # API key. No long-lived NUGET_API_KEY secret is needed.
      - name: Authenticate to NuGet.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: DanielvGinneken

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Remove signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-cert.pfx"
