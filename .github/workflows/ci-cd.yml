name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    # Per-package release tags, e.g. UniFi.Protect.Client-v7.1.87
    tags: [ 'UniFi.*-v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: 10.0.x

# Least privilege by default; publish jobs opt into more where needed.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore UniFi.NET.slnx

      - name: Build solution (Release)
        run: dotnet build UniFi.NET.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UniFi.NET.slnx --configuration Release --no-build --verbosity normal

  # ---- Canary: pack every package and publish prereleases to GitHub Packages (main only) ----
  pack:
    name: Pack ${{ matrix.name }}
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UniFi.Network.Client
            project: src/UniFi.Network.Client/UniFi.Network.Client.csproj
          - name: UniFi.SiteManager.Client
            project: src/UniFi.SiteManager.Client/UniFi.SiteManager.Client.csproj
          - name: UniFi.Protect.Client
            project: src/UniFi.Protect.Client/UniFi.Protect.Client.csproj
          - name: UniFi.Mobility.Client
            project: src/UniFi.Mobility.Client/UniFi.Mobility.Client.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine canary version
        id: version
        run: |
          CSPROJ_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "${{ matrix.project }}")
          BASE_VERSION=${CSPROJ_VERSION:-1.0.0}
          echo "pkg_version=${BASE_VERSION}-canary.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Pack ${{ matrix.name }}
        run: >
          dotnet pack "${{ matrix.project }}"
          --configuration Release
          /p:Version=${{ steps.version.outputs.pkg_version }}
          --output ${{ github.workspace }}/artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-${{ matrix.name }}
          path: ${{ github.workspace }}/artifacts/*.nupkg

  publish-canary:
    name: Publish Canary (GitHub Packages)
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nuget-*
          merge-multiple: true
          path: ${{ github.workspace }}/artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

  # ---- Release: publish ONLY the tagged package to NuGet.org ----
  # Triggered by a per-package tag like "UniFi.Protect.Client-v7.1.87".
  publish-release:
    name: Publish ${{ github.ref_name }}
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Must match the Environment configured on the NuGet.org Trusted Publisher policy.
    environment: production
    permissions:
      contents: read
      id-token: write   # required to mint the short-lived OIDC token for Trusted Publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package and version from tag
        id: pkg
        run: |
          TAG="${{ github.ref_name }}"      # e.g. UniFi.Protect.Client-v7.1.87-preview.1
          NAME="${TAG%-v*}"                 # UniFi.Protect.Client
          VERSION="${TAG##*-v}"             # 7.1.87-preview.1
          PROJECT="src/${NAME}/${NAME}.csproj"
          if [ ! -f "$PROJECT" ]; then
            echo "::error::Tag '$TAG' does not map to a project ($PROJECT). Expected <PackageId>-v<version>."
            exit 1
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "Releasing $NAME $VERSION"

      - name: Pack ${{ steps.pkg.outputs.name }}
        run: >
          dotnet pack "${{ steps.pkg.outputs.project }}"
          --configuration Release
          /p:Version=${{ steps.pkg.outputs.version }}
          --output ${{ github.workspace }}/artifacts

      - name: Sign package
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMPER: ${{ vars.SIGNING_TIMESTAMPER_URL || 'http://timestamp.digicert.com' }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::No signing certificate configured (SIGNING_CERTIFICATE_BASE64). Publishing UNSIGNED. Register a certificate on NuGet.org and add the secret to enable signing."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/signing-cert.pfx"
          echo "$CERT_BASE64" | base64 -d > "$CERT_PATH"
          dotnet nuget sign "${{ github.workspace }}/artifacts/*.nupkg" \
            --certificate-path "$CERT_PATH" \
            --certificate-password "$CERT_PASSWORD" \
            --timestamper "$TIMESTAMPER"

      # Trusted Publishing: exchange the workflow's OIDC token for a short-lived NuGet.org
      # API key. No long-lived NUGET_API_KEY secret is needed.
      - name: Authenticate to NuGet.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: DanielvGinneken

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Remove signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-cert.pfx"
