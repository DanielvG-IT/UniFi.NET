name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore UniFi.NET.slnx

      - name: Build solution (Release)
        run: dotnet build UniFi.NET.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UniFi.NET.slnx --configuration Release --no-build --verbosity normal

      - name: Determine Package Version
        id: version
        run: |
          # Read the version directly from .csproj (e.g. 10.4.57)
          CSPROJ_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/UniFi.Network.Client/UniFi.Network.Client.csproj)
          
          # Fallback if no <Version> tag is set in .csproj
          BASE_VERSION=${CSPROJ_VERSION:-1.0.0}

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Production Release: Exact version from the git tag (e.g. 10.4.57)
            PKG_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Canary Build: Takes target version from .csproj + build number (e.g. 10.4.57-canary.12)
            PKG_VERSION="${BASE_VERSION}-canary.${{ github.run_number }}"
          fi

          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Pack Package
        run: >
          dotnet pack src/UniFi.Network.Client/UniFi.Network.Client.csproj
          --configuration Release
          --no-build
          /p:Version=${{ steps.version.outputs.pkg_version }}
          --output ${{ github.workspace }}/artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts/*.nupkg

  publish-canary:
    name: Publish Canary (GitHub Packages)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

  publish-nuget:
    name: Publish Release (NuGet.org)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate